name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: reporting_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: reporting_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reporting_test -d reporting_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      REPORTING_TEST_DATABASE_URL: postgresql://reporting_test:isolated-ci-only@127.0.0.1:5432/reporting_tests

    steps:
      - name: Checkout
        # actions/checkout@v7.0.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        # actions/setup-node@v6.4.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx --no-install prisma generate

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Apply migrations to isolated test database
        env:
          DATABASE_URL: ${{ env.REPORTING_TEST_DATABASE_URL }}
        run: npx --no-install prisma migrate deploy

      - name: Run reporting transaction tests
        run: npm run test:reporting

      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium

      - name: Run reporting browser tests
        run: npm run test:browser

      - name: Type check
        run: npx --no-install tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Build
        run: npm run build
